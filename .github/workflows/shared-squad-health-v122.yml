name: Apply shared squad health v122

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-shared-health:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply shared squad health
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patch-shared-health-v122.py
          node --check src/core/Game.js
          node --check src/core/UI.js
          node --check src/systems/ProgressionSystem.js
          node --check src/features/captainThorne.js
          node --check src/features/wardenBoss.js
          node --check src/features/broodmotherBoss.js
          node --check src/features/cipherBoss.js
          node --check src/features/squadBuilderVisuals.js
          node --check src/features/squadFormation.js
          node --check src/main.js
          grep -q 'SQUAD_HP_PER_ADDITIONAL_UNIT = 0.1' src/core/Game.js
          grep -q 'this.applySquadDamage(damage)' src/core/Game.js
          grep -q "this.hpLabel.textContent = 'Squad Health'" src/core/UI.js
          grep -q 'healSquadHealthFraction' src/systems/ProgressionSystem.js
          grep -q "dataset.healthState = 'shared'" src/features/squadBuilderVisuals.js
          grep -q 'const GAME_VERSION = 122;' src/main.js
          grep -q 'BUILD v122' index.html
          grep -q 'id="version-text">v122<' index.html
          grep -q 'SYSTEM ONLINE • v122' index.html

      - name: Commit v122 and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/shared-squad-health-v122.yml .github/patch-shared-health-v122.py
          git add src/core/Game.js src/core/UI.js src/systems/ProgressionSystem.js \
            src/features/captainThorne.js src/features/wardenBoss.js \
            src/features/broodmotherBoss.js src/features/cipherBoss.js \
            src/features/squadBuilderVisuals.js src/features/squadFormation.js \
            src/main.js index.html
          git diff --cached --check
          git commit -m 'Use shared squad health pool and bump v122'
          git push origin HEAD:main
