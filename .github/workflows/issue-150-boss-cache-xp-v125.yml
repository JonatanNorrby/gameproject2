name: One-shot issue 150 Boss Cache XP v125

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-150-boss-cache-xp-v125.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply issue 150 reward and version sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chest_path = Path('src/features/treasureChests.js')
          chest = chest_path.read_text()
          old_boss = "const BOSS_CHEST_TUNING = TREASURE_CHEST_TUNING[TREASURE_CHEST_TUNING.length - 1];"
          new_boss = """const BOSS_CHEST_TUNING = Object.freeze({
            ...TREASURE_CHEST_TUNING[TREASURE_CHEST_TUNING.length - 1],
            xpFraction: 1.5,
          });"""
          if old_boss not in chest:
              raise SystemExit('Expected Boss Cache tuning line not found')
          chest = chest.replace(old_boss, new_boss, 1)
          chest_path.write_text(chest)

          main_path = Path('src/main.js')
          main = main_path.read_text()
          old_version = 'const GAME_VERSION = 124;'
          if old_version not in main:
              raise SystemExit('Expected v124 runtime marker not found')
          main_path.write_text(main.replace(old_version, 'const GAME_VERSION = 125;', 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          replacements = [
              ('BUILD v124', 'BUILD v125'),
              ('<span id="version-text">v124</span>', '<span id="version-text">v125</span>'),
              ('SYSTEM ONLINE • v124', 'SYSTEM ONLINE • v125'),
          ]
          for old, new in replacements:
              if old not in index:
                  raise SystemExit(f'Expected index marker not found: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index)

          assert 'xpFraction: 1.5' in chest_path.read_text()
          assert 'const GAME_VERSION = 125;' in main_path.read_text()
          final_index = index_path.read_text()
          assert 'BUILD v125' in final_index
          assert '<span id="version-text">v125</span>' in final_index
          assert 'SYSTEM ONLINE • v125' in final_index
          PY
      - name: Validate edited JavaScript
        run: |
          node --check src/features/treasureChests.js
          node --check src/main.js
      - name: Commit cleaned v125 tree
        shell: bash
        run: |
          rm .github/workflows/issue-150-boss-cache-xp-v125.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/treasureChests.js src/main.js index.html .github/workflows/issue-150-boss-cache-xp-v125.yml
          git commit -m "Greatly increase Boss Cache XP for issue #150 and bump v125"
          git push
