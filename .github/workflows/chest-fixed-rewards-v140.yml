name: Chest fixed rewards v140

on:
  push:
    paths:
      - '.github/workflows/chest-fixed-rewards-v140.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixed chest rewards and version sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chest_path = Path('src/features/treasureChests.js')
          chest = chest_path.read_text()
          replacements = [
              (
                  "export const TREASURE_CHEST_GOLD_REWARD = 5;\nexport const TREASURE_CHEST_XP_FRACTION = 0.25;",
                  "export const TREASURE_CHEST_GOLD_REWARD = 2;\nexport const TREASURE_CHEST_XP_REWARD = 25;",
              ),
              (
                  "const TREASURE_CHEST_TUNING = Object.freeze([\n  Object.freeze({ dropChance: 0, goldReward: 0, xpFraction: 0 }),\n  Object.freeze({ dropChance: 0.025, goldReward: 5, xpFraction: 0.25 }),\n  Object.freeze({ dropChance: 0.04, goldReward: 8, xpFraction: 0.33 }),\n  Object.freeze({ dropChance: 0.06, goldReward: 12, xpFraction: 0.45 }),\n]);\n\nconst BOSS_CHEST_TUNING = Object.freeze({\n  ...TREASURE_CHEST_TUNING[TREASURE_CHEST_TUNING.length - 1],\n  xpFraction: 1.5,\n});",
                  "const TREASURE_CHEST_TUNING = Object.freeze([\n  Object.freeze({ dropChance: 0, goldReward: 0 }),\n  Object.freeze({ dropChance: 0.025, goldReward: TREASURE_CHEST_GOLD_REWARD }),\n  Object.freeze({ dropChance: 0.04, goldReward: TREASURE_CHEST_GOLD_REWARD }),\n  Object.freeze({ dropChance: 0.06, goldReward: TREASURE_CHEST_GOLD_REWARD }),\n]);\n\n// Boss Caches keep their separate boss-specific reward path.\nconst BOSS_CHEST_TUNING = Object.freeze({ goldReward: 12, xpFraction: 1.5 });",
              ),
              (
                  "export function getTreasureChestXpReward(player, chest = null) {\n  const xpToNext = Math.max(1, Number(player?.xpToNext) || 1);\n  return Math.max(1, Math.round(xpToNext * getChestRewardTuning(chest).xpFraction));\n}",
                  "export function getTreasureChestXpReward(player, chest = null) {\n  if (!chest?.bossReward) return TREASURE_CHEST_XP_REWARD;\n  const xpToNext = Math.max(1, Number(player?.xpToNext) || 1);\n  return Math.max(1, Math.round(xpToNext * BOSS_CHEST_TUNING.xpFraction));\n}",
              ),
          ]
          for old, new in replacements:
              if old not in chest:
                  raise SystemExit(f'Missing expected Treasure Chest source block: {old[:80]!r}')
              chest = chest.replace(old, new, 1)
          chest_path.write_text(chest)

          meta_path = Path('src/data/metaUpgrades.js')
          meta = meta_path.read_text()
          meta_replacements = [
              (
                  "description: 'Enemies can drop treasure chests containing Gold and XP. Higher ranks improve both frequency and rewards.',",
                  "description: 'Eligible enemies can drop treasure chests containing a fixed 25 XP and 2 Gold. Higher ranks improve drop frequency.',",
              ),
              ("'2.5% chest chance • 5 Gold • 25% of next-level XP.'", "'2.5% chest chance • 2 Gold • 25 XP.'"),
              ("'4% chest chance • 8 Gold • 33% of next-level XP.'", "'4% chest chance • 2 Gold • 25 XP.'"),
              ("'6% chest chance • 12 Gold • 45% of next-level XP.'", "'6% chest chance • 2 Gold • 25 XP.'"),
          ]
          for old, new in meta_replacements:
              if old not in meta:
                  raise SystemExit(f'Missing expected meta-upgrade text: {old}')
              meta = meta.replace(old, new, 1)
          meta_path.write_text(meta)

          main_path = Path('src/main.js')
          main = main_path.read_text()
          if 'const GAME_VERSION = 139;' not in main:
              raise SystemExit('Expected GAME_VERSION 139')
          main_path.write_text(main.replace('const GAME_VERSION = 139;', 'const GAME_VERSION = 140;', 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          for old, new in [
              ('BUILD v139', 'BUILD v140'),
              ('id="version-text">v139', 'id="version-text">v140'),
              ('SYSTEM ONLINE • v139', 'SYSTEM ONLINE • v140'),
          ]:
              if old not in index:
                  raise SystemExit(f'Missing version marker: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index)

          checks = {
              'fixed normal chest reward': 'export const TREASURE_CHEST_XP_REWARD = 25;' in chest and 'export const TREASURE_CHEST_GOLD_REWARD = 2;' in chest,
              'boss cache separate': "BOSS_CHEST_TUNING = Object.freeze({ goldReward: 12, xpFraction: 1.5 })" in chest,
              'rank 1 description': '2.5% chest chance • 2 Gold • 25 XP.' in meta,
              'rank 2 description': '4% chest chance • 2 Gold • 25 XP.' in meta,
              'rank 3 description': '6% chest chance • 2 Gold • 25 XP.' in meta,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY

          node --check src/features/treasureChests.js
          node --check src/data/metaUpgrades.js
          node --check src/main.js

      - name: Commit cleaned v140 tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/chest-fixed-rewards-v140.yml
          git add src/features/treasureChests.js src/data/metaUpgrades.js src/main.js index.html .github/workflows/chest-fixed-rewards-v140.yml
          git commit -m 'Use fixed Treasure Chest rewards and bump v140'
          git push
