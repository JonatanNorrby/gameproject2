name: Chest behavior v137

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/chest-behavior-v137.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update chest behavior and bump v137
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          chest_path = Path('src/features/treasureChests.js')
          text = chest_path.read_text(encoding='utf-8')

          assert text.count('export const TREASURE_CHEST_UNLOCK_DURATION = 5;') == 1
          text = text.replace(
              'export const TREASURE_CHEST_UNLOCK_DURATION = 5;',
              'export const TREASURE_CHEST_UNLOCK_DURATION = 0;',
          )

          old_update = '''      if (!standingOnChest) {
        chest.unlockProgress = 0;
        continue;
      }

      chest.unlockProgress = Math.min(
        getChestUnlockDuration(chest),
        (chest.unlockProgress ?? 0) + dt,
      );
      if (chest.unlockProgress >= getChestUnlockDuration(chest)) {
        this.collectTreasureChest(chest);
      }
'''
          new_update = '''      if (!standingOnChest) continue;

      const unlockDuration = getChestUnlockDuration(chest);
      if (unlockDuration <= 0) {
        this.collectTreasureChest(chest);
        continue;
      }

      chest.unlockProgress = Math.min(
        unlockDuration,
        (chest.unlockProgress ?? 0) + dt,
      );
      if (chest.unlockProgress >= unlockDuration) {
        this.collectTreasureChest(chest);
      }
'''
          assert text.count(old_update) == 1, 'Expected chest update block once'
          text = text.replace(old_update, new_update)

          old_progress = '''      const progress = Math.max(
        0,
        Math.min(1, (chest.unlockProgress ?? 0) / getChestUnlockDuration(chest)),
      );
'''
          new_progress = '''      const unlockDuration = getChestUnlockDuration(chest);
      const progress = unlockDuration <= 0
        ? 0
        : Math.max(0, Math.min(1, (chest.unlockProgress ?? 0) / unlockDuration));
'''
          assert text.count(old_progress) == 1, 'Expected chest progress render block once'
          text = text.replace(old_progress, new_progress)
          assert text.count('          getChestUnlockDuration(chest) - (chest.unlockProgress ?? 0),') == 1
          text = text.replace(
              '          getChestUnlockDuration(chest) - (chest.unlockProgress ?? 0),',
              '          unlockDuration - (chest.unlockProgress ?? 0),',
          )
          chest_path.write_text(text, encoding='utf-8')

          main_path = Path('src/main.js')
          main = main_path.read_text(encoding='utf-8')
          assert main.count('const GAME_VERSION = 136;') == 1
          main_path.write_text(main.replace('const GAME_VERSION = 136;', 'const GAME_VERSION = 137;'), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          for old, new in [
              ('BUILD v136', 'BUILD v137'),
              ('id="version-text">v136<', 'id="version-text">v137<'),
              ('SYSTEM ONLINE • v136', 'SYSTEM ONLINE • v137'),
          ]:
              assert index.count(old) == 1, f'Expected version marker once: {old}'
              index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')
          PY

          node --check src/features/treasureChests.js
          node --check src/main.js
          grep -Fq 'export const TREASURE_CHEST_UNLOCK_DURATION = 0;' src/features/treasureChests.js
          grep -Fq 'export const BOSS_CHEST_UNLOCK_DURATION = 2.5;' src/features/treasureChests.js
          grep -Fq 'if (!standingOnChest) continue;' src/features/treasureChests.js
          grep -Fq 'if (unlockDuration <= 0)' src/features/treasureChests.js
          grep -Fq 'const GAME_VERSION = 137;' src/main.js
          grep -Fq 'BUILD v137' index.html
          grep -Fq 'id="version-text">v137<' index.html
          grep -Fq 'SYSTEM ONLINE • v137' index.html
          grep -Fq 'setGameVersion?.(GAME_VERSION)' src/main.js

      - name: Commit cleaned v137 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chest-behavior-v137.yml
          git add src/features/treasureChests.js src/main.js index.html
          git commit -m 'Make chest capture behavior consistent and bump v137'
          git push
