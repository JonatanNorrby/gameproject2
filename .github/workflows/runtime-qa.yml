name: Validate final runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate final runtime import, Captain slots and boss rendering
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          const classList = { add() {}, remove() {}, toggle() {}, contains() { return false; } };
          const elementStub = () => ({
            dataset: {},
            style: { setProperty() {} },
            classList,
            append() {},
            appendChild() {},
            prepend() {},
            after() {},
            before() {},
            remove() {},
            replaceChildren() {},
            setAttribute() {},
            removeAttribute() {},
            addEventListener() {},
            querySelector() { return null; },
            querySelectorAll() { return []; },
            closest() { return null; },
            focus() {},
          });

          globalThis.document = {
            head: { append() {}, appendChild() {} },
            body: { append() {}, appendChild() {}, classList },
            fonts: { ready: Promise.resolve() },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            createElement() { return elementStub(); },
            createDocumentFragment() { return elementStub(); },
          };
          globalThis.window = {
            localStorage: null,
            addEventListener() {},
            removeEventListener() {},
            setTimeout() { return 0; },
            clearTimeout() {},
            queueMicrotask(callback) { callback(); },
            requestAnimationFrame(callback) { callback(0); },
            devicePixelRatio: 1,
            innerWidth: 1280,
            innerHeight: 720,
          };

          const runtime = await import('./src/features/bossVisibilityFix.js');
          const slots = await import('./src/data/captainSlots.js');
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          assert(typeof runtime.Game === 'function', 'Final Game runtime export missing');
          assert(typeof runtime.UI === 'function', 'Final UI runtime export missing');
          assert(typeof runtime.Game.prototype.getCaptainSoldierBySlot === 'function', 'Captain slot lookup missing');
          assert(typeof runtime.Game.prototype.beginCipherSquadRetreat === 'function', 'Cipher retreat compatibility missing');
          assert(typeof runtime.Game.prototype.getCipherHazardTargets === 'function', 'Cipher hazard compatibility missing');
          assert(typeof runtime.Game.prototype.drawBossEncounterEntities === 'function', 'Boss visibility compatibility renderer missing');
          assert(typeof runtime.Game.prototype.drawSupremeCommanderGlow === 'function', 'Supreme Commander glow renderer missing');
          assert(typeof runtime.UI.prototype.applyIssue54Presentation === 'function', 'Issue 54 main/loading screen cleanup missing');
          assert(typeof runtime.UI.prototype.applyIssue54CaptainPrompt === 'function', 'Issue 54 Captain prompt cleanup missing');
          assert(typeof runtime.UI.prototype.installMainMenuDebug === 'function', 'Issue 54 main-menu debug placement missing');

          const primary = { captainId: 'vale', primaryCaptain: true, secondaryCaptain: false, tertiaryCaptain: false, dead: false };
          const secondary = { captainId: 'mercer', secondaryCaptain: true, tertiaryCaptain: false, dead: false };
          const tertiary = { captainId: 'thorne', secondaryCaptain: false, tertiaryCaptain: true, dead: false };
          assert(slots.isPrimaryCaptainSlotUnit(primary), 'Primary Captain was not recognized as primary');
          assert(!slots.isPrimaryCaptainSlotUnit(secondary), 'Secondary Captain was incorrectly recognized as primary');
          assert(!slots.isPrimaryCaptainSlotUnit(tertiary), 'Tertiary Captain was incorrectly recognized as primary');
          assert(slots.isAdditionalCaptainUnit(secondary), 'Secondary Captain was not recognized as additional');
          assert(slots.isAdditionalCaptainUnit(tertiary), 'Tertiary Captain was not recognized as additional');
          assert(slots.getCaptainSlot(primary) === 'primary', 'Primary slot resolution failed');
          assert(slots.getCaptainSlot(secondary) === 'secondary', 'Secondary slot resolution failed');
          assert(slots.getCaptainSlot(tertiary) === 'tertiary', 'Tertiary slot resolution failed');

          const renderCalls = [];
          const warden = { id: 'warden' };
          const broodmother = { id: 'broodmother' };
          const cipher = { id: 'cipher' };
          const renderMock = {
            drawBroodEggs() { renderCalls.push('eggs'); },
            getActiveWarden() { return warden; },
            drawWarden(_ctx, boss) {
              assert(boss === warden, 'Wrong Warden instance passed to renderer');
              renderCalls.push('warden');
            },
            getActiveBroodmother() { return broodmother; },
            drawBroodmother(_ctx, boss) {
              assert(boss === broodmother, 'Wrong Broodmother instance passed to renderer');
              renderCalls.push('broodmother');
            },
            getActiveCipher() { return cipher; },
            drawCipher(_ctx, boss) {
              assert(boss === cipher, 'Wrong Cipher instance passed to renderer');
              renderCalls.push('cipher');
            },
          };
          runtime.Game.prototype.drawBossEncounterEntities.call(renderMock, {});
          assert(
            renderCalls.join(',') === 'eggs,warden,broodmother,cipher',
            `Boss render chain is incomplete or out of order: ${renderCalls.join(',')}`,
          );

          const glowCalls = { gradients: 0, arcs: 0, fills: 0, strokes: 0 };
          const glowContext = {
            createRadialGradient() {
              glowCalls.gradients += 1;
              return { addColorStop() {} };
            },
            save() {},
            restore() {},
            beginPath() {},
            arc() { glowCalls.arcs += 1; },
            fill() { glowCalls.fills += 1; },
            stroke() { glowCalls.strokes += 1; },
            set fillStyle(_value) {},
          };
          const glowMock = {
            getSupremeCommanderUnit() { return { id: 'supreme-commander' }; },
            animationClock: 1,
            player: { x: 100, y: 120 },
          };
          runtime.Game.prototype.drawSupremeCommanderGlow.call(glowMock, glowContext);
          assert(glowCalls.gradients === 1, 'Supreme Commander soft glow gradient is missing');
          assert(glowCalls.arcs === 1 && glowCalls.fills === 1, 'Supreme Commander glow was not filled exactly once');
          assert(glowCalls.strokes === 0, 'Supreme Commander gameplay platform ring returned');

          console.log('Final runtime, Captain-slot compatibility, boss rendering, Supreme Commander glow and issue 54 presentation APIs validated.');
          NODE

      - name: Validate HUD Gold layout, Supreme menu glow, issue 54 UI and version sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          main = pathlib.Path('src/main.js').read_text(encoding='utf-8')
          index = pathlib.Path('index.html').read_text(encoding='utf-8')
          hud = pathlib.Path('styles/hud-layout.css').read_text(encoding='utf-8')
          progression = pathlib.Path('src/features/metaUpgradeTree.js').read_text(encoding='utf-8')
          runtime = pathlib.Path('src/features/bossVisibilityFix.js').read_text(encoding='utf-8')
          supreme_css = pathlib.Path('styles/issue-37-38.css').read_text(encoding='utf-8')

          match = re.search(r'const GAME_VERSION = (\d+);', main)
          assert match, 'GAME_VERSION missing from src/main.js'
          version = match.group(1)
          assert f'BUILD v{version}' in index, 'Boot version source marker is out of sync'
          assert f'id="version-text">v{version}<' in index, 'HUD version source marker is out of sync'
          assert f'SYSTEM ONLINE • v{version}' in index, 'Main-menu version source marker is out of sync'
          assert 'setGameVersion?.(GAME_VERSION)' in main, 'Settings version is not synchronized from GAME_VERSION'

          assert './styles/hud-layout.css' in index, 'HUD layout stylesheet is not linked'
          assert "card.id = 'gold-hud-card'" in progression, 'Gold HUD card creation is missing'
          assert 'hudTop.append(card)' in progression, 'Gold HUD card is not part of the top stats row'
          assert '#gold-hud-card' in hud, 'Gold HUD card styling is missing'
          assert 'repeat(4, auto)' in hud, 'Desktop HUD does not reserve four compact stat columns'
          assert 'repeat(4, minmax(58px, .55fr))' in hud, 'Tablet HUD does not reserve four compact stat columns'
          assert 'repeat(4, minmax(0, 1fr))' in hud, 'Mobile HUD does not keep all four compact stats on one row'
          assert 'text-align: center' in hud and 'gap: 2px' in hud, 'Gold label/value spacing is not normalized'

          after_match = re.search(
              r'selected-captain-card__portrait::after\s*\{([^}]*)\}',
              supreme_css,
              re.S,
          )
          assert after_match, 'Supreme Commander menu platform override missing'
          after_rules = after_match.group(1)
          assert 'content: none' in after_rules and 'display: none' in after_rules, 'Supreme Commander menu platform is not disabled'
          assert 'radial-gradient' in supreme_css and 'supreme-menu-glow' in supreme_css, 'Supreme Commander menu glow was removed with the platform'

          # #54: visible presentation is rewritten by the final runtime before the
          # app shell is revealed. Keep these phrases/layout rules as contracts.
          assert 'initialazing nightfall protocol command systems' in runtime, 'Loading-screen systems text missing'
          assert "build.textContent = 'SYSTEM ONLINE'" in runtime, 'Main-menu SYSTEM ONLINE cleanup missing'
          assert '// Nightfall command systems' in runtime, 'Bottom-left command systems label missing'
          assert 'Click here to choose Captain' in runtime, 'Captain choice prompt missing'
          assert "title.textContent = 'Select Captain'" in runtime, 'Captain prompt was not simplified'
          assert 'main-menu__debug-launch' in runtime, 'Small bottom-left main debug control missing'
          assert '.boot-screen::after' in runtime and '.boot-screen__track' in runtime, 'Loading-screen line cleanup missing'
          assert 'width: 9px' in runtime and '0 0 38px' in runtime, 'SYSTEM ONLINE indicator glow/size contract missing'
          assert 'main-menu__brief' in runtime and "querySelector('#start-screen .main-menu__brief')?.remove?.()" in runtime, 'Mission/controls panel cleanup missing'

          print(f'HUD layout, Supreme Commander glow-only visuals, issue 54 menu/loading presentation and v{version} synchronization validated.')
          PY
