name: One-shot issue 149 Stormlancer balance v124

on:
  push:
    paths:
      - '.github/workflows/issue-149-stormlancer-v124.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply issue 149 balance and version sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          storm = Path('src/data/stormlancer.js')
          text = storm.read_text()
          replacements = {
              'damage: 52,': 'damage: 65,',
              'range: 112,': 'range: 200,',
              'aoeRadius: 120,': 'aoeRadius: 240,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing Stormlancer marker: {old}')
              text = text.replace(old, new, 1)
          storm.write_text(text)

          main = Path('src/main.js')
          text = main.read_text()
          if 'const GAME_VERSION = 123;' not in text:
              raise SystemExit('Expected GAME_VERSION 123 not found')
          main.write_text(text.replace('const GAME_VERSION = 123;', 'const GAME_VERSION = 124;', 1))

          index = Path('index.html')
          text = index.read_text()
          markers = {
              'BUILD v123': 'BUILD v124',
              '<span id="version-text">v123</span>': '<span id="version-text">v124</span>',
              'SYSTEM ONLINE • v123': 'SYSTEM ONLINE • v124',
          }
          for old, new in markers.items():
              if old not in text:
                  raise SystemExit(f'Missing version marker: {old}')
              text = text.replace(old, new, 1)
          index.write_text(text)

          storm_text = storm.read_text()
          assert 'damage: 65,' in storm_text
          assert 'range: 200,' in storm_text
          assert 'aoeRadius: 240,' in storm_text
          assert 'const GAME_VERSION = 124;' in main.read_text()
          index_text = index.read_text()
          assert 'BUILD v124' in index_text
          assert '<span id="version-text">v124</span>' in index_text
          assert 'SYSTEM ONLINE • v124' in index_text
          PY

      - name: Validate edited JavaScript
        run: |
          node --check src/data/stormlancer.js
          node --check src/main.js

      - name: Commit cleaned v124 tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-149-stormlancer-v124.yml
          git add src/data/stormlancer.js src/main.js index.html
          git commit -m "Balance Stormlancer for issue #149 and bump v124"
          git push
