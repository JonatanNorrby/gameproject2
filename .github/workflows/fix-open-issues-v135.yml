name: Fix open issues v133-v135

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-open-issues-v135.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix issue 158 and bump v133
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          data = Path('src/data/supportUnits.js')
          text = data.read_text(encoding='utf-8')
          assert text.count('range: 620,') == 1
          text = text.replace('range: 620,', 'range: 1000,')
          text = text.replace('      droneHp: 34,\n', '')
          text = text.replace('      respawnDelay: 7.5,\n', '')
          data.write_text(text, encoding='utf-8')

          feature = Path('src/features/supportUnits.js')
          text = feature.read_text(encoding='utf-8')
          text = text.replace("const DAMAGE_FLASH_DURATION = 0.16;\n", '')
          anchor = "const MERCER_ID = 'mercer';\n"
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + "const DRONE_PRIORITY_ENEMY_TYPES = new Set(['spitter', 'burst_spitter']);\n")
          text = text.replace('''            hp: support.droneHp,\n            maxHp: support.droneHp,\n            dead: false,\n            respawnAt: 0,\n''', '''            dead: false,\n''')
          text = text.replace('''            target: null,\n            hitFlash: 0,\n            mercerAttackCount: 0,\n''', '''            target: null,\n            mercerAttackCount: 0,\n''')
          respawn = '''        } else if (drone.dead && game.elapsed >= drone.respawnAt) {\n          drone.dead = false;\n          drone.hp = drone.maxHp;\n          drone.x = pilot.x + 28;\n          drone.y = pilot.y - 18;\n          drone.grenadeCooldown = 0.75;\n          drone.target = null;\n          drone.hitFlash = 0;\n          drone.mercerAttackCount = 0;\n'''
          assert text.count(respawn) == 1
          text = text.replace(respawn, '')

          marker = '''    updateSupportDrones(dt) {\n'''
          helper = '''    findDroneTarget(x, y, range) {\n      const rangeSq = range * range;\n      let priorityTarget = null;\n      let priorityDistance = Infinity;\n\n      for (const enemy of this.game.entities?.enemies ?? []) {\n        if (enemy.dead || (enemy.hp ?? 0) <= 0 || !DRONE_PRIORITY_ENEMY_TYPES.has(enemy.type)) continue;\n        const dist = distanceSq(x, y, enemy.x, enemy.y);\n        if (dist > rangeSq || dist >= priorityDistance) continue;\n        priorityDistance = dist;\n        priorityTarget = enemy;\n      }\n\n      return priorityTarget ?? this.findNearestTarget(x, y, range);\n    }\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper + marker)
          text = text.replace('''        drone.hitFlash = Math.max(0, (drone.hitFlash ?? 0) - dt);\n        if (drone.dead) continue;\n''', '''        if (drone.dead) continue;\n''')
          old_target = '''        if (!target && drone.grenadeCooldown <= 0) {\n          target = this.findNearestTarget(drone.x, drone.y, range);\n        }\n'''
          assert text.count(old_target) == 1
          text = text.replace(old_target, '''        if (!target && drone.grenadeCooldown <= 0) {\n          target = this.findDroneTarget(drone.x, drone.y, range);\n        }\n''')

          target_damage_block = re.compile(r'''\n    findNearestSoldierTarget\(x, y, soldiers\) \{.*?\n    resolveDroneProjectileHits\(projectiles\) \{.*?\n    \}\n''', re.S)
          text, count = target_damage_block.subn('\n', text, count=1)
          assert count == 1, 'Expected drone target/damage block once'

          hit_flash = re.compile(r'''\n      if \(\(drone\.hitFlash \?\? 0\) > 0\) \{.*?\n      \}\n\n      const health = .*?\n      ctx\.restore\(\);''', re.S)
          text, count = hit_flash.subn('', text, count=1)
          assert count == 1, 'Expected drone flash/health bar block once'

          feature.write_text(text, encoding='utf-8')

          main = Path('src/main.js')
          text = main.read_text(encoding='utf-8')
          assert text.count('const GAME_VERSION = 132;') == 1
          main.write_text(text.replace('const GAME_VERSION = 132;', 'const GAME_VERSION = 133;'), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          for old, new in [('BUILD v132','BUILD v133'), ('id="version-text">v132<','id="version-text">v133<'), ('SYSTEM ONLINE • v132','SYSTEM ONLINE • v133')]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')
          PY
          node --check src/features/supportUnits.js
          node --check src/data/supportUnits.js
          grep -Fq 'range: 1000,' src/data/supportUnits.js
          grep -Fq "DRONE_PRIORITY_ENEMY_TYPES = new Set(['spitter', 'burst_spitter'])" src/features/supportUnits.js
          ! grep -Fq 'resolveDroneProjectileHits' src/features/supportUnits.js
          ! grep -Fq 'drone.hp' src/features/supportUnits.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/supportUnits.js src/data/supportUnits.js src/main.js index.html
          git commit -m 'Fix drone buffs for issue #158 and bump v133'

      - name: Fix issue 159 and bump v134
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          game = Path('src/core/Game.js')
          text = game.read_text(encoding='utf-8')
          anchor = '''      ctx.translate(drop.x, drop.y + bob);\n      ctx.scale(pulse, pulse);\n'''
          assert text.count(anchor) == 1
          special = '''      ctx.translate(drop.x, drop.y + bob);\n      ctx.scale(pulse, pulse);\n\n      if (drop.type === 'health') {\n        const arm = drop.radius * 0.82;\n        ctx.lineCap = 'round';\n        ctx.shadowBlur = 22;\n        ctx.shadowColor = definition.color;\n        ctx.strokeStyle = definition.color;\n        ctx.lineWidth = Math.max(5, drop.radius * 0.45);\n        ctx.beginPath();\n        ctx.moveTo(-arm, 0);\n        ctx.lineTo(arm, 0);\n        ctx.moveTo(0, -arm);\n        ctx.lineTo(0, arm);\n        ctx.stroke();\n\n        ctx.globalAlpha = 0.58;\n        ctx.shadowBlur = 10;\n        ctx.strokeStyle = '#e2ffea';\n        ctx.lineWidth = Math.max(2, drop.radius * 0.16);\n        ctx.beginPath();\n        ctx.moveTo(-arm, 0);\n        ctx.lineTo(arm, 0);\n        ctx.moveTo(0, -arm);\n        ctx.lineTo(0, arm);\n        ctx.stroke();\n        ctx.restore();\n        continue;\n      }\n'''
          text = text.replace(anchor, special)
          game.write_text(text, encoding='utf-8')

          main = Path('src/main.js')
          text = main.read_text(encoding='utf-8')
          assert text.count('const GAME_VERSION = 133;') == 1
          main.write_text(text.replace('const GAME_VERSION = 133;', 'const GAME_VERSION = 134;'), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          for old, new in [('BUILD v133','BUILD v134'), ('id="version-text">v133<','id="version-text">v134<'), ('SYSTEM ONLINE • v133','SYSTEM ONLINE • v134')]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')
          PY
          node --check src/core/Game.js
          grep -Fq "if (drop.type === 'health')" src/core/Game.js
          grep -Fq "ctx.strokeStyle = '#e2ffea';" src/core/Game.js
          git add src/core/Game.js src/main.js index.html
          git commit -m 'Redesign health drops for issue #159 and bump v134'

      - name: Fix issue 160, bump v135, and clean helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          file = Path('src/features/loadingScreenPolish.js')
          text = file.read_text(encoding='utf-8')
          old_css = '''  .settings-run-actions .end-run-button {\n    width: 100%;\n    align-self: stretch;\n  }\n'''
          new_css = '''  .settings-run-actions .primary-button,\n  .settings-run-actions .end-run-button {\n    width: 100%;\n    min-height: 42px;\n    align-self: stretch;\n  }\n\n  .settings-run-actions .settings-resume-run {\n    min-width: 86px;\n    padding: 8px 12px;\n    font-size: 10px;\n  }\n'''
          assert text.count(old_css) == 1
          text = text.replace(old_css, new_css)

          ctor = '''    this.settingsOpenedInGame = false;\n    this.applyIssue88LoadingScreen();\n'''
          replacement = '''    this.settingsOpenedInGame = false;\n    this.settingsBackHome = this.settingsBack ? {\n      parent: this.settingsBack.parentElement,\n      nextSibling: this.settingsBack.nextSibling,\n    } : null;\n    this.applyIssue88LoadingScreen();\n'''
          assert text.count(ctor) == 1
          text = text.replace(ctor, replacement)

          show_marker = '''  showSettings(...args) {\n'''
          helper = '''  placeSettingsBackButton(inRunActions) {\n    const button = this.settingsBack;\n    if (!button) return;\n\n    if (inRunActions) {\n      const actions = this.settingsRunSection?.querySelector('.settings-run-actions');\n      if (!actions) return;\n      button.classList.add('settings-resume-run');\n      if (button.parentElement !== actions || actions.firstElementChild !== button) actions.prepend(button);\n      return;\n    }\n\n    button.classList.remove('settings-resume-run');\n    const home = this.settingsBackHome;\n    if (!home?.parent || button.parentElement === home.parent) return;\n    if (home.nextSibling && home.nextSibling.parentNode === home.parent) {\n      home.parent.insertBefore(button, home.nextSibling);\n    } else {\n      home.parent.append(button);\n    }\n  }\n\n'''
          assert text.count(show_marker) == 1
          text = text.replace(show_marker, helper + show_marker)

          in_show = '''    if (this.settingsOpenedInGame) {\n      game.pause?.('settings');\n      if (this.settingsBack) this.settingsBack.textContent = 'Resume Run';\n    } else if (this.settingsBack) {\n      this.settingsBack.textContent = 'Back to Main Menu';\n    }\n\n    return super.showSettings(...args);\n'''
          out_show = '''    if (this.settingsOpenedInGame) {\n      game.pause?.('settings');\n      if (this.settingsBack) this.settingsBack.textContent = 'Resume Run';\n    } else if (this.settingsBack) {\n      this.settingsBack.textContent = 'Back to Main Menu';\n    }\n    this.placeSettingsBackButton(this.settingsOpenedInGame);\n\n    return super.showSettings(...args);\n'''
          assert text.count(in_show) == 1
          text = text.replace(in_show, out_show)

          hide = '''    if (resumeRun) this.game?.resume?.('settings');\n    if (this.settingsBack) this.settingsBack.textContent = 'Back to Main Menu';\n    return result;\n'''
          hide_new = '''    if (resumeRun) this.game?.resume?.('settings');\n    if (this.settingsBack) this.settingsBack.textContent = 'Back to Main Menu';\n    this.placeSettingsBackButton(false);\n    return result;\n'''
          assert text.count(hide) == 1
          text = text.replace(hide, hide_new)
          file.write_text(text, encoding='utf-8')

          main = Path('src/main.js')
          text = main.read_text(encoding='utf-8')
          assert text.count('const GAME_VERSION = 134;') == 1
          main.write_text(text.replace('const GAME_VERSION = 134;', 'const GAME_VERSION = 135;'), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          for old, new in [('BUILD v134','BUILD v135'), ('id="version-text">v134<','id="version-text">v135<'), ('SYSTEM ONLINE • v134','SYSTEM ONLINE • v135')]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')
          PY
          node --check src/features/loadingScreenPolish.js
          grep -Fq 'placeSettingsBackButton(inRunActions)' src/features/loadingScreenPolish.js
          grep -Fq "button.classList.add('settings-resume-run')" src/features/loadingScreenPolish.js
          grep -Fq 'const GAME_VERSION = 135;' src/main.js
          grep -Fq 'BUILD v135' index.html
          grep -Fq 'id="version-text">v135<' index.html
          grep -Fq 'SYSTEM ONLINE • v135' index.html
          grep -Fq 'setGameVersion?.(GAME_VERSION)' src/main.js
          git rm .github/workflows/fix-open-issues-v135.yml
          git add src/features/loadingScreenPolish.js src/main.js index.html
          git commit -m 'Swap Resume and End Run for issue #160 and bump v135'
          git push
