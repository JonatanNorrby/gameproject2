name: No crawler runner chests v139

on:
  push:
    paths:
      - '.github/workflows/no-crawler-runner-chests-v139.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply chest restriction and version sync
        run: |
          python - <<'PY'
          from pathlib import Path

          chest_path = Path('src/features/treasureChests.js')
          chest = chest_path.read_text()
          old = "      if (!wasAlive || !enemy?.dead || options.allowDrop === false) return;\n      const tuning = getTreasureChestTuning();"
          new = "      if (!wasAlive || !enemy?.dead || options.allowDrop === false) return;\n      if (enemy.type === 'crawler' || enemy.type === 'runner') return;\n      const tuning = getTreasureChestTuning();"
          assert old in chest, 'treasure chest kill hook changed unexpectedly'
          chest_path.write_text(chest.replace(old, new, 1))

          main_path = Path('src/main.js')
          main = main_path.read_text()
          assert 'const GAME_VERSION = 138;' in main, 'expected v138 main marker'
          main_path.write_text(main.replace('const GAME_VERSION = 138;', 'const GAME_VERSION = 139;', 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          for old_marker, new_marker in (
              ('BUILD v138', 'BUILD v139'),
              ('>v138<', '>v139<'),
              ('SYSTEM ONLINE • v138', 'SYSTEM ONLINE • v139'),
          ):
              assert old_marker in index, f'missing index marker: {old_marker}'
              index = index.replace(old_marker, new_marker, 1)
          index_path.write_text(index)
          PY
          grep -q "enemy.type === 'crawler' || enemy.type === 'runner'" src/features/treasureChests.js
          grep -q 'const GAME_VERSION = 139;' src/main.js
          grep -q 'BUILD v139' index.html
          grep -q '>v139<' index.html
          grep -q 'SYSTEM ONLINE • v139' index.html
      - name: Commit cleaned v139 tree
        run: |
          rm .github/workflows/no-crawler-runner-chests-v139.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/treasureChests.js src/main.js index.html .github/workflows/no-crawler-runner-chests-v139.yml
          git commit -m 'Prevent crawler and runner chest drops and bump v139'
          git push
