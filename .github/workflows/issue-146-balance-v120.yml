name: One-shot issue 146 balance and v120

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-146-balance-v120.yml'

permissions:
  contents: write

jobs:
  apply-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply issue 146 balance and v120
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          content_path = Path('src/data/content.js')
          content = content_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "label: 'Crawler', radius: 19.5, speed: 78, hp: 30, damage: 8, xp: 1,\n    fill: '#db5c83', outline: '#ff9db9', unlockAt: 0, weight: 9,",
                  "label: 'Crawler', radius: 19.5, speed: 72, hp: 27, damage: 8, xp: 1,\n    fill: '#db5c83', outline: '#ff9db9', unlockAt: 0, weight: 6,",
              ),
              (
                  "label: 'Runner', radius: 10, speed: 128, hp: 19, damage: 6, xp: 1,",
                  "label: 'Runner', radius: 10, speed: 128, hp: 1, damage: 6, xp: 1,",
              ),
          ]
          for old, new in replacements:
              assert old in content, f'Expected balance marker missing: {old}'
              content = content.replace(old, new, 1)
          content_path.write_text(content, encoding='utf-8')

          ranged_path = Path('src/features/rangedEnemies.js')
          ranged = ranged_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '// Keep ranged enemies uncommon, but make them appear a little more often than before.\nObject.assign(ENEMY_TYPES.spitter, {\n  weight: 0.42,\n  maxActive: 4,\n});',
                  '// #146: shift the normal roster away from Crawlers and toward ranged pressure.\n// Keep caps in place so Spitters are more common without flooding the arena.\nObject.assign(ENEMY_TYPES.spitter, {\n  weight: 0.75,\n  maxActive: 5,\n});',
              ),
              (
                  '    weight: 0.2,\n    maxActive: 2,',
                  '    weight: 0.4,\n    maxActive: 3,',
              ),
          ]
          for old, new in replacements:
              assert old in ranged, f'Expected ranged balance marker missing: {old}'
              ranged = ranged.replace(old, new, 1)
          ranged_path.write_text(ranged, encoding='utf-8')

          main_path = Path('src/main.js')
          main = main_path.read_text(encoding='utf-8')
          assert 'const GAME_VERSION = 119;' in main, 'Expected v119 GAME_VERSION marker missing'
          main_path.write_text(main.replace('const GAME_VERSION = 119;', 'const GAME_VERSION = 120;', 1), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          version_replacements = [
              ('BUILD v119', 'BUILD v120'),
              ('id="version-text">v119<', 'id="version-text">v120<'),
              ('SYSTEM ONLINE • v119', 'SYSTEM ONLINE • v120'),
          ]
          for old, new in version_replacements:
              assert old in index, f'Expected version marker missing: {old}'
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding='utf-8')

          # Guard the exact requested balance before committing.
          final_content = content_path.read_text(encoding='utf-8')
          final_ranged = ranged_path.read_text(encoding='utf-8')
          assert "speed: 72, hp: 27" in final_content
          assert "unlockAt: 0, weight: 6" in final_content
          assert "speed: 128, hp: 1" in final_content
          assert "weight: 0.75" in final_ranged and "maxActive: 5" in final_ranged
          assert "weight: 0.4" in final_ranged and "maxActive: 3" in final_ranged
          PY

          node --check src/data/content.js
          node --check src/features/rangedEnemies.js
          node --check src/main.js

      - name: Commit issue 146 and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-146-balance-v120.yml
          git add src/data/content.js src/features/rangedEnemies.js src/main.js index.html
          git commit -m 'Balance enemy roster for issue #146 and bump v120'
          git push origin HEAD:main
