name: Deploy static game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate local module imports
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          failures = []
          import_pattern = re.compile(
              r"(?:\bfrom\s*|\bimport\s*)['\"]([^'\"]+)['\"]"
          )

          for source in pathlib.Path('src').rglob('*.js'):
              text = source.read_text(encoding='utf-8')
              for specifier in import_pattern.findall(text):
                  if not specifier.startswith('.'):
                      continue
                  target = (source.parent / specifier).resolve()
                  if target.exists():
                      continue
                  if target.suffix == '' and target.with_suffix('.js').exists():
                      continue
                  failures.append(f"{source}: missing import {specifier}")

          if not pathlib.Path('src/main.js').exists():
              failures.append('Missing src/main.js entry point')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)

          print('All relative JavaScript imports resolve.')
          PY

      - name: Validate active runtime module graph
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          const elementStub = () => ({
            dataset: {},
            style: {},
            append() {},
            appendChild() {},
            prepend() {},
            after() {},
            remove() {},
            replaceChildren() {},
            setAttribute() {},
            addEventListener() {},
            querySelector() { return null; },
            querySelectorAll() { return []; },
            closest() { return null; },
          });

          globalThis.document = {
            head: { append() {}, appendChild() {} },
            body: { append() {}, appendChild() {}, classList: { add() {}, remove() {} } },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            createElement() { return elementStub(); },
          };
          globalThis.window = {
            localStorage: null,
            addEventListener() {},
            removeEventListener() {},
            devicePixelRatio: 1,
            innerWidth: 1280,
            innerHeight: 720,
          };

          // main.js imports this final layer. Validate the complete active chain.
          const runtime = await import('./src/features/treasureChests.js');
          if (typeof runtime.Game !== 'function' || typeof runtime.UI !== 'function') {
            throw new Error('Final Treasure Chests runtime layer did not export Game/UI');
          }
          console.log('Complete active runtime module graph imports successfully.');
          NODE

      - name: Validate unit class families and permanent upgrades
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          const elementStub = () => ({
            dataset: {},
            style: {},
            append() {},
            appendChild() {},
            prepend() {},
            after() {},
            remove() {},
            replaceChildren() {},
            setAttribute() {},
            addEventListener() {},
            querySelector() { return null; },
            querySelectorAll() { return []; },
            closest() { return null; },
          });
          globalThis.document = {
            head: { append() {}, appendChild() {} },
            body: { append() {}, appendChild() {}, classList: { add() {}, remove() {} } },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            createElement() { return elementStub(); },
          };
          globalThis.window = {
            localStorage: null,
            addEventListener() {},
            removeEventListener() {},
            devicePixelRatio: 1,
            innerWidth: 1280,
            innerHeight: 720,
          };

          const finalRuntime = await import('./src/features/treasureChests.js');
          const { CAPTAINS, UNIT_CLASSES, UPGRADES } = await import('./src/data/content.js');
          const { createUnitModifierState } = await import('./src/data/unitModifiers.js');
          const { getUnitClassFamily } = await import('./src/data/unitFamilies.js');
          const { getUpgradeIconSpec } = await import('./src/data/upgradeIcons.js');
          const { THORNE_CAPTAIN } = await import('./src/data/captainThorne.js');
          const {
            BEEFED_UP_HP_BONUS,
            PERMANENT_UPGRADES,
            canPurchasePermanentUpgrade,
            grantGold,
            purchasePermanentUpgrade,
            resetPermanentProgression,
          } = await import('./src/data/metaUpgrades.js');

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const expectedFamilies = {
            rifleman: 'rifleman',
            sniper: 'rifleman',
            rocketeer: 'rocketeer',
            drone_pilot: 'rocketeer',
            shockblade: 'shockblade',
            stormlancer: 'shockblade',
          };
          for (const [unitType, family] of Object.entries(expectedFamilies)) {
            assert(UNIT_CLASSES[unitType], `Missing unit type ${unitType}`);
            assert(getUnitClassFamily(unitType) === family, `${unitType} is not in ${family} class`);
          }

          for (const alternateType of ['sniper', 'drone_pilot', 'stormlancer']) {
            assert(
              !UPGRADES.some((upgrade) => upgrade.kind === 'stat' && upgrade.unitType === alternateType),
              `${alternateType} still has separate stat upgrade cards`,
            );
          }

          const iconExpectations = {
            'sniper-reinforcements': 'rifleman',
            'drone_pilot-reinforcements': 'rocketeer',
            'stormlancer-reinforcements': 'shockblade',
          };
          for (const [upgradeId, classKey] of Object.entries(iconExpectations)) {
            const upgrade = UPGRADES.find((candidate) => candidate.id === upgradeId);
            assert(upgrade, `Missing ${upgradeId}`);
            assert(getUpgradeIconSpec(upgrade).classKey === classKey, `${upgradeId} has wrong class icon`);
          }

          const modifierState = createUnitModifierState();
          const mockGame = { unitModifiers: modifierState, addSquadUnits() {} };
          const uncommon = { id: 'uncommon' };
          const sharedUpgradeChecks = [
            ['rifleman-damage', 'rifleman', 'sniper', 'damage'],
            ['rifleman-pierce', 'rifleman', 'sniper', 'pierce'],
            ['rocketeer-fire-rate', 'rocketeer', 'drone_pilot', 'fireRate'],
            ['rocketeer-blast-radius', 'rocketeer', 'drone_pilot', 'blastRadius'],
            ['shockblade-range', 'shockblade', 'stormlancer', 'range'],
            ['shockblade-damage', 'shockblade', 'stormlancer', 'damage'],
          ];
          for (const [upgradeId, first, second, stat] of sharedUpgradeChecks) {
            const upgrade = UPGRADES.find((candidate) => candidate.id === upgradeId);
            assert(upgrade, `Missing shared upgrade ${upgradeId}`);
            const beforeA = modifierState[first][stat];
            const beforeB = modifierState[second][stat];
            upgrade.apply(mockGame, uncommon);
            assert(modifierState[first][stat] !== beforeA, `${upgradeId} did not modify ${first}`);
            assert(modifierState[second][stat] !== beforeB, `${upgradeId} did not modify ${second}`);
          }

          assert(CAPTAINS.mercer?.effect?.everyShots === 3, 'Mercer interval must be 3');
          assert(CAPTAINS.mercer?.effect?.aoeMultiplier === 3, 'Mercer third attack must use 3x area');
          assert(CAPTAINS.mercer?.effect?.rangeMultiplier === 1.75, 'Mercer Rocketeer range multiplier must be 1.75');
          assert(THORNE_CAPTAIN.effect.everyAttacks === 3, 'Thorne interval must be 3');
          assert(THORNE_CAPTAIN.effect.stormlancerChainMultiplier === 2, 'Stormlancer Thorne chain multiplier must be 2');

          const third = PERMANENT_UPGRADES.third_captain_slot;
          assert(third, 'Missing Third Captain permanent upgrade');
          assert(third.cost === 50, 'Third Captain should cost 50 Gold');
          assert(third.requires?.includes('second_captain_slot'), 'Third Captain must require Second Captain Slot');
          resetPermanentProgression();
          grantGold(200);
          assert(!canPurchasePermanentUpgrade('third_captain_slot'), 'Third Captain was purchasable before Second Captain Slot');
          assert(purchasePermanentUpgrade('second_captain_slot'), 'Could not purchase Second Captain Slot');
          assert(canPurchasePermanentUpgrade('third_captain_slot'), 'Third Captain did not unlock after Second Captain Slot');
          assert(purchasePermanentUpgrade('third_captain_slot'), 'Could not purchase Third Captain');
          assert(typeof finalRuntime.Game.prototype.getCaptainSoldierBySlot === 'function', 'Third Captain Game slot lookup missing');
          assert(typeof finalRuntime.UI.prototype.getSelectedThirdCaptainId === 'function', 'Third Captain UI selector API missing');

          const beefedUp = PERMANENT_UPGRADES.beefed_up;
          assert(beefedUp, 'Missing Beefed Up permanent upgrade');
          assert(beefedUp.cost === 50, 'Beefed Up should cost 50 Gold');
          assert(BEEFED_UP_HP_BONUS === 50, 'Beefed Up HP bonus must be +50');
          resetPermanentProgression();
          grantGold(50);
          assert(canPurchasePermanentUpgrade('beefed_up'), 'Beefed Up was not purchasable with 50 Gold');
          assert(purchasePermanentUpgrade('beefed_up'), 'Could not purchase Beefed Up');
          const testUnit = { hp: 100, maxHp: 100 };
          const { applyBeefedUpHealthBonus } = await import('./src/features/beefedUp.js');
          assert(applyBeefedUpHealthBonus(testUnit), 'Beefed Up helper did not apply');
          assert(testUnit.maxHp === 150 && testUnit.hp === 150, 'Beefed Up did not add exactly +50 HP');
          assert(!applyBeefedUpHealthBonus(testUnit), 'Beefed Up applied twice to the same unit');
          assert(testUnit.maxHp === 150 && testUnit.hp === 150, 'Beefed Up stacked twice on one unit');

          const treasure = PERMANENT_UPGRADES.treasure_chests;
          assert(treasure, 'Missing Treasure Chests permanent upgrade');
          assert(treasure.cost === 50, 'Treasure Chests should cost 50 Gold');
          assert(finalRuntime.TREASURE_CHEST_DROP_CHANCE === 0.025, 'Treasure Chest drop chance must be 2.5%');
          assert(finalRuntime.TREASURE_CHEST_GOLD_REWARD === 5, 'Treasure Chest Gold reward must be 5');
          assert(finalRuntime.TREASURE_CHEST_XP_FRACTION === 0.25, 'Treasure Chest XP fraction must be 25%');
          assert(finalRuntime.getTreasureChestXpReward({ xpToNext: 100 }) === 25, 'Treasure Chest XP scaling is incorrect');
          resetPermanentProgression();
          grantGold(50);
          assert(canPurchasePermanentUpgrade('treasure_chests'), 'Treasure Chests was not purchasable with 50 Gold');
          assert(purchasePermanentUpgrade('treasure_chests'), 'Could not purchase Treasure Chests');
          assert(typeof finalRuntime.Game.prototype.spawnTreasureChest === 'function', 'Treasure Chest spawn API missing');
          assert(typeof finalRuntime.Game.prototype.collectTreasureChest === 'function', 'Treasure Chest collection API missing');

          console.log('Unit class and permanent-upgrade contracts validated.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
