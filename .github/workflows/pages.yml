name: Deploy static game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate local module imports
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          failures = []
          import_pattern = re.compile(
              r"(?:\bfrom\s*|\bimport\s*)['\"]([^'\"]+)['\"]"
          )

          for source in pathlib.Path('src').rglob('*.js'):
              text = source.read_text(encoding='utf-8')
              for specifier in import_pattern.findall(text):
                  if not specifier.startswith('.'):
                      continue
                  target = (source.parent / specifier).resolve()
                  if target.exists():
                      continue
                  if target.suffix == '' and target.with_suffix('.js').exists():
                      continue
                  failures.append(f"{source}: missing import {specifier}")

          if not pathlib.Path('src/main.js').exists():
              failures.append('Missing src/main.js entry point')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)

          print('All relative JavaScript imports resolve.')
          PY

      - name: Validate active runtime module graph
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          await import('./src/features/runtimeSafety.js');
          console.log('Active runtime module graph imports successfully.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
