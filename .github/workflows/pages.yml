name: Deploy static game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate local module imports
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          failures = []
          import_pattern = re.compile(
              r"(?:\bfrom\s*|\bimport\s*)['\"]([^'\"]+)['\"]"
          )

          for source in pathlib.Path('src').rglob('*.js'):
              text = source.read_text(encoding='utf-8')
              for specifier in import_pattern.findall(text):
                  if not specifier.startswith('.'):
                      continue
                  target = (source.parent / specifier).resolve()
                  if target.exists():
                      continue
                  if target.suffix == '' and target.with_suffix('.js').exists():
                      continue
                  failures.append(f"{source}: missing import {specifier}")

          if not pathlib.Path('src/main.js').exists():
              failures.append('Missing src/main.js entry point')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)

          print('All relative JavaScript imports resolve.')
          PY

      - name: Validate active runtime module graph
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          const elementStub = () => ({
            dataset: {},
            style: {},
            append() {},
            appendChild() {},
            prepend() {},
            after() {},
            before() {},
            remove() {},
            replaceChildren() {},
            setAttribute() {},
            addEventListener() {},
            querySelector() { return null; },
            querySelectorAll() { return []; },
            closest() { return null; },
          });

          globalThis.document = {
            head: { append() {}, appendChild() {} },
            body: { append() {}, appendChild() {}, classList: { add() {}, remove() {} } },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            createElement() { return elementStub(); },
            createDocumentFragment() { return elementStub(); },
          };
          globalThis.window = {
            localStorage: null,
            addEventListener() {},
            removeEventListener() {},
            devicePixelRatio: 1,
            innerWidth: 1280,
            innerHeight: 720,
          };

          // main.js imports this final layer. Validate the complete active chain.
          const runtime = await import('./src/features/debugMobSpawner.js');
          if (typeof runtime.Game !== 'function' || typeof runtime.UI !== 'function') {
            throw new Error('Final Debug Mob Spawner runtime layer did not export Game/UI');
          }
          console.log('Complete active runtime module graph imports successfully.');
          NODE

      - name: Validate unit class families and permanent upgrades
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          const elementStub = () => ({
            dataset: {},
            style: {},
            append() {},
            appendChild() {},
            prepend() {},
            after() {},
            before() {},
            remove() {},
            replaceChildren() {},
            setAttribute() {},
            addEventListener() {},
            querySelector() { return null; },
            querySelectorAll() { return []; },
            closest() { return null; },
          });
          globalThis.document = {
            head: { append() {}, appendChild() {} },
            body: { append() {}, appendChild() {}, classList: { add() {}, remove() {} } },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            createElement() { return elementStub(); },
            createDocumentFragment() { return elementStub(); },
          };
          globalThis.window = {
            localStorage: null,
            addEventListener() {},
            removeEventListener() {},
            devicePixelRatio: 1,
            innerWidth: 1280,
            innerHeight: 720,
          };

          const finalRuntime = await import('./src/features/debugMobSpawner.js');
          const treasureRuntime = await import('./src/features/treasureChests.js');
          const { CAPTAINS, ENEMY_TYPES, UNIT_CLASSES, UPGRADES } = await import('./src/data/content.js');
          const { createUnitModifierState } = await import('./src/data/unitModifiers.js');
          const { getUnitClassFamily } = await import('./src/data/unitFamilies.js');
          const { getUpgradeIconSpec } = await import('./src/data/upgradeIcons.js');
          const { THORNE_CAPTAIN } = await import('./src/data/captainThorne.js');
          const {
            BEEFED_UP_HP_BONUS,
            CAPTAIN_CALL_UPGRADE_IDS,
            PERMANENT_UPGRADES,
            canPurchasePermanentUpgrade,
            getPermanentUpgradeNextCost,
            getPermanentUpgradeRank,
            grantGold,
            isPermanentUpgradeOwned,
            purchasePermanentUpgrade,
            resetPermanentProgression,
          } = await import('./src/data/metaUpgrades.js');

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const expectedFamilies = {
            rifleman: 'rifleman',
            sniper: 'rifleman',
            rocketeer: 'rocketeer',
            drone_pilot: 'rocketeer',
            shockblade: 'shockblade',
            stormlancer: 'shockblade',
          };
          for (const [unitType, family] of Object.entries(expectedFamilies)) {
            assert(UNIT_CLASSES[unitType], `Missing unit type ${unitType}`);
            assert(getUnitClassFamily(unitType) === family, `${unitType} is not in ${family} class`);
          }

          for (const alternateType of ['sniper', 'drone_pilot', 'stormlancer']) {
            assert(
              !UPGRADES.some((upgrade) => upgrade.kind === 'stat' && upgrade.unitType === alternateType),
              `${alternateType} still has separate stat upgrade cards`,
            );
          }

          const iconExpectations = {
            'sniper-reinforcements': 'rifleman',
            'drone_pilot-reinforcements': 'rocketeer',
            'stormlancer-reinforcements': 'shockblade',
          };
          for (const [upgradeId, classKey] of Object.entries(iconExpectations)) {
            const upgrade = UPGRADES.find((candidate) => candidate.id === upgradeId);
            assert(upgrade, `Missing ${upgradeId}`);
            assert(getUpgradeIconSpec(upgrade).classKey === classKey, `${upgradeId} has wrong class icon`);
          }

          const modifierState = createUnitModifierState();
          const mockGame = { unitModifiers: modifierState, addSquadUnits() {} };
          const uncommon = { id: 'uncommon' };
          const sharedUpgradeChecks = [
            ['rifleman-damage', 'rifleman', 'sniper', 'damage'],
            ['rifleman-pierce', 'rifleman', 'sniper', 'pierce'],
            ['rocketeer-fire-rate', 'rocketeer', 'drone_pilot', 'fireRate'],
            ['rocketeer-blast-radius', 'rocketeer', 'drone_pilot', 'blastRadius'],
            ['shockblade-range', 'shockblade', 'stormlancer', 'range'],
            ['shockblade-damage', 'shockblade', 'stormlancer', 'damage'],
          ];
          for (const [upgradeId, first, second, stat] of sharedUpgradeChecks) {
            const upgrade = UPGRADES.find((candidate) => candidate.id === upgradeId);
            assert(upgrade, `Missing shared upgrade ${upgradeId}`);
            const beforeA = modifierState[first][stat];
            const beforeB = modifierState[second][stat];
            upgrade.apply(mockGame, uncommon);
            assert(modifierState[first][stat] !== beforeA, `${upgradeId} did not modify ${first}`);
            assert(modifierState[second][stat] !== beforeB, `${upgradeId} did not modify ${second}`);
          }

          assert(CAPTAINS.mercer?.effect?.everyShots === 3, 'Mercer interval must be 3');
          assert(CAPTAINS.mercer?.effect?.aoeMultiplier === 3, 'Mercer third attack must use 3x area');
          assert(CAPTAINS.mercer?.effect?.rangeMultiplier === 1.75, 'Mercer Rocketeer range multiplier must be 1.75');
          assert(THORNE_CAPTAIN.effect.everyAttacks === 3, 'Thorne interval must be 3');
          assert(THORNE_CAPTAIN.effect.stormlancerChainMultiplier === 2, 'Stormlancer Thorne chain multiplier must be 2');

          for (const upgrade of Object.values(PERMANENT_UPGRADES)) {
            assert(upgrade.maxRank >= 1, `${upgrade.id} has no ranks`);
            assert(upgrade.costs?.length === upgrade.maxRank, `${upgrade.id} rank costs are incomplete`);
            assert(upgrade.costs[0] >= 100, `${upgrade.id} starts below the 100 Gold minimum`);
            for (let index = 1; index < upgrade.costs.length; index += 1) {
              assert(
                upgrade.costs[index] > upgrade.costs[index - 1],
                `${upgrade.id} rank costs do not increase`,
              );
            }
          }

          const slots = PERMANENT_UPGRADES.captain_slots;
          assert(slots, 'Missing Captain Slots ranked permanent upgrade');
          assert(slots.maxRank === 2, 'Captain Slots must have exactly two ranks');
          assert(slots.costs[0] === 150 && slots.costs[1] === 400, 'Captain Slots costs changed unexpectedly');
          resetPermanentProgression();
          grantGold(550);
          assert(canPurchasePermanentUpgrade('captain_slots'), 'Captain Slots rank 1 is not purchasable');
          assert(purchasePermanentUpgrade('captain_slots'), 'Could not purchase Captain Slots rank 1');
          assert(getPermanentUpgradeRank('captain_slots') === 1, 'Captain Slots did not reach rank 1');
          assert(isPermanentUpgradeOwned('second_captain_slot'), 'Rank 1 did not unlock the second Captain slot');
          assert(!isPermanentUpgradeOwned('third_captain_slot'), 'Rank 1 incorrectly unlocked the third Captain slot');
          assert(getPermanentUpgradeNextCost('captain_slots') === 400, 'Captain Slots rank 2 cost is incorrect');
          assert(purchasePermanentUpgrade('captain_slots'), 'Could not purchase Captain Slots rank 2');
          assert(getPermanentUpgradeRank('captain_slots') === 2, 'Captain Slots did not reach rank 2');
          assert(isPermanentUpgradeOwned('third_captain_slot'), 'Rank 2 did not unlock the third Captain slot');
          assert(typeof finalRuntime.Game.prototype.getCaptainSoldierBySlot === 'function', 'Third Captain Game slot lookup missing');
          assert(typeof finalRuntime.UI.prototype.getSelectedThirdCaptainId === 'function', 'Third Captain UI selector API missing');

          const callIds = Object.values(CAPTAIN_CALL_UPGRADE_IDS);
          assert(callIds.length === 3, 'Expected three separate Captain Call upgrades');
          for (const callId of callIds) {
            const call = PERMANENT_UPGRADES[callId];
            assert(call?.maxRank === 3, `${callId} must have three ranks`);
            assert(call.costs[0] === 150, `${callId} rank 1 should cost 150 Gold`);
          }

          const beefedUp = PERMANENT_UPGRADES.beefed_up;
          assert(beefedUp, 'Missing Beefed Up permanent upgrade');
          assert(beefedUp.costs[0] === 100, 'Beefed Up rank 1 should cost 100 Gold');
          assert(beefedUp.maxRank === 3, 'Beefed Up should have three ranks');
          assert(BEEFED_UP_HP_BONUS === 50, 'Beefed Up rank-1 HP bonus must be +50');
          resetPermanentProgression();
          grantGold(100);
          assert(canPurchasePermanentUpgrade('beefed_up'), 'Beefed Up was not purchasable with 100 Gold');
          assert(purchasePermanentUpgrade('beefed_up'), 'Could not purchase Beefed Up rank 1');
          const testUnit = { hp: 100, maxHp: 100 };
          const { applyBeefedUpHealthBonus } = await import('./src/features/beefedUp.js');
          assert(applyBeefedUpHealthBonus(testUnit), 'Beefed Up helper did not apply');
          assert(testUnit.maxHp === 150 && testUnit.hp === 150, 'Beefed Up rank 1 did not add exactly +50 HP');
          assert(!applyBeefedUpHealthBonus(testUnit), 'Beefed Up applied twice to the same unit');
          assert(testUnit.maxHp === 150 && testUnit.hp === 150, 'Beefed Up stacked twice on one unit');

          const treasure = PERMANENT_UPGRADES.treasure_chests;
          assert(treasure, 'Missing Treasure Chests permanent upgrade');
          assert(treasure.costs[0] === 125, 'Treasure Chests rank 1 should cost 125 Gold');
          assert(treasure.maxRank === 3, 'Treasure Chests should have three ranks');
          assert(treasureRuntime.TREASURE_CHEST_DROP_CHANCE === 0.025, 'Treasure Chest rank-1 drop chance must be 2.5%');
          assert(treasureRuntime.TREASURE_CHEST_GOLD_REWARD === 2, 'Treasure Chest Gold reward must be 2');
          assert(treasureRuntime.TREASURE_CHEST_XP_REWARD === 25, 'Treasure Chest fixed XP reward must be 25');
          resetPermanentProgression();
          grantGold(125);
          assert(canPurchasePermanentUpgrade('treasure_chests'), 'Treasure Chests was not purchasable with 125 Gold');
          assert(purchasePermanentUpgrade('treasure_chests'), 'Could not purchase Treasure Chests rank 1');
          assert(treasureRuntime.getTreasureChestXpReward({ xpToNext: 100 }) === 25, 'Treasure Chest fixed XP reward is incorrect');
          assert(treasureRuntime.getTreasureChestXpReward({ xpToNext: 500 }) === 25, 'Treasure Chest XP reward must not scale with level');
          assert(typeof treasureRuntime.Game.prototype.spawnTreasureChest === 'function', 'Treasure Chest spawn API missing');
          assert(typeof treasureRuntime.Game.prototype.collectTreasureChest === 'function', 'Treasure Chest collection API missing');

          const debugMobEntries = finalRuntime.getDebugMobEntries();
          const debugMobIds = new Set(debugMobEntries.map(([id]) => id));
          const registeredMobIds = Object.keys(ENEMY_TYPES);
          assert(registeredMobIds.length > 0, 'No normal enemy types are registered');
          for (const mobId of registeredMobIds) {
            assert(debugMobIds.has(mobId), `Debug mob roster is missing ${mobId}`);
          }
          for (const expectedMob of ['crawler', 'runner', 'brute', 'spitter', 'burst_spitter', 'charger']) {
            assert(ENEMY_TYPES[expectedMob], `Expected mob ${expectedMob} is not registered`);
            assert(debugMobIds.has(expectedMob), `Expected mob ${expectedMob} is missing from debug controls`);
          }
          assert(typeof finalRuntime.Game.prototype.debugSpawnMob === 'function', 'Debug single-mob spawn API missing');
          assert(typeof finalRuntime.Game.prototype.debugSpawnAllMobs === 'function', 'Debug all-mobs spawn API missing');
          assert(typeof finalRuntime.UI.prototype.installMobDebugControls === 'function', 'Debug mob controls UI installer missing');

          const mockSpawnGame = {
            elapsed: 120,
            player: { x: 100, y: 200 },
            entities: { createId: () => 987 },
          };
          const crawler = finalRuntime.createDebugMobState(mockSpawnGame, 'crawler', 0);
          assert(crawler?.id === 987 && crawler.type === 'crawler', 'Debug mob state creation failed');
          assert(crawler.hp > ENEMY_TYPES.crawler.hp, 'Debug mob did not inherit current-time HP scaling');
          assert(crawler.x > mockSpawnGame.player.x, 'Debug mob did not spawn around the player');

          console.log('Unit class, ranked permanent-upgrade and debug-mob contracts validated.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
