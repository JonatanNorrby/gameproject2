name: One-shot v131 upgrade tree visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revamp-upgrade-tree-v131.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v131 upgrade tree patch
        run: python3 .github/patch-upgrade-tree-v131.py

      - name: Validate v131 upgrade tree
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/upgradeActivation.js
          node --check src/main.js
          grep -Fq 'grid-auto-flow: column' styles/meta-upgrades.css
          grep -Fq 'meta-upgrade-rank-track' styles/meta-upgrades.css
          grep -Fq 'for (let rankNumber = 1; rankNumber <= upgrade.maxRank; rankNumber += 1)' src/features/upgradeActivation.js
          grep -Fq 'meta-upgrade-rank--affordable' src/features/upgradeActivation.js
          grep -Fq 'Each upgrade has its own column' src/features/upgradeActivation.js
          grep -Fq 'const GAME_VERSION = 131;' src/main.js
          grep -Fq 'BUILD v131' index.html
          grep -Fq 'id="version-text">v131<' index.html
          grep -Fq 'SYSTEM ONLINE • v131' index.html
          grep -Fq 'setGameVersion?.(GAME_VERSION)' src/main.js

      - name: Commit cleaned v131 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/patch-upgrade-tree-v131.py .github/workflows/revamp-upgrade-tree-v131.yml
          git add src/features/upgradeActivation.js styles/meta-upgrades.css src/main.js index.html
          git commit -m 'Revamp ranked upgrade tree visuals and bump v131'
          git push
