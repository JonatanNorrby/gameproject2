name: One-shot issue 147 enemy hit glow and v121

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-hit-glow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply issue 147 hit glow and v121
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/enemyStatusVisuals.js')
          source = path.read_text(encoding='utf-8')
          source = source.replace("const DAMAGE_FLASH_COLOR = '#ff4b5f';", "const DAMAGE_GLOW_COLOR = '#ff334d';")
          old_flash = "function drawDamageFlash(ctx, enemy) {\n  ctx.save();\n  ctx.globalAlpha = 0.78;\n  ctx.strokeStyle = DAMAGE_FLASH_COLOR;\n  ctx.lineWidth = 2.5;\n  ctx.beginPath();\n  ctx.arc(enemy.x, enemy.y, enemy.radius + 3, 0, Math.PI * 2);\n  ctx.stroke();\n  ctx.restore();\n}\n"
          new_glow = "function drawDamageGlow(ctx, enemy) {\n  // #147: cheap translucent fills sit behind the sprite instead of using\n  // Canvas filters/shadowBlur, avoiding the old multi-hit render spikes.\n  const radius = enemy.radius + 4;\n  ctx.save();\n  ctx.fillStyle = DAMAGE_GLOW_COLOR;\n  ctx.globalAlpha = 0.07;\n  ctx.beginPath();\n  ctx.arc(enemy.x, enemy.y, radius * 1.8, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.globalAlpha = 0.12;\n  ctx.beginPath();\n  ctx.arc(enemy.x, enemy.y, radius * 1.45, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.globalAlpha = 0.2;\n  ctx.beginPath();\n  ctx.arc(enemy.x, enemy.y, radius * 1.16, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n}\n"
          if old_flash not in source: raise SystemExit('Expected old damage flash renderer not found')
          source = source.replace(old_flash, new_glow)
          old_fallback = "function drawFallbackEnemy(ctx, enemy, type, takingDamage) {\n  ctx.save();\n  ctx.translate(enemy.x, enemy.y);\n  ctx.fillStyle = takingDamage ? '#ff4659' : type.fill;\n  ctx.strokeStyle = takingDamage ? '#ffc0c8' : type.outline;\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  drawEnemyShape(ctx, enemy);\n  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n"
          new_fallback = "function drawFallbackEnemy(ctx, enemy, type) {\n  ctx.save();\n  ctx.translate(enemy.x, enemy.y);\n  ctx.fillStyle = type.fill;\n  ctx.strokeStyle = type.outline;\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  drawEnemyShape(ctx, enemy);\n  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n"
          if old_fallback not in source: raise SystemExit('Expected old fallback damage tint not found')
          source = source.replace(old_fallback, new_fallback)
          old_frame = "  const takingDamage = (enemy.hitFlash ?? 0) > 0;\n  const sprite = getEnemySprite(enemy.type);\n  const animationName = attacking ? 'shooting' : 'running';\n"
          new_frame = "  const takingDamage = (enemy.hitFlash ?? 0) > 0;\n  const sprite = getEnemySprite(enemy.type);\n  if (takingDamage) drawDamageGlow(ctx, enemy);\n\n  const animationName = attacking ? 'shooting' : 'running';\n"
          if old_frame not in source: raise SystemExit('Expected enemy frame renderer not found')
          source = source.replace(old_frame, new_frame)
          old_post = "  if (!spriteDrawn) drawFallbackEnemy(ctx, enemy, type, takingDamage);\n  else if (takingDamage) drawDamageFlash(ctx, enemy);\n"
          new_post = "  if (!spriteDrawn) drawFallbackEnemy(ctx, enemy, type);\n"
          if old_post not in source: raise SystemExit('Expected post-sprite damage outline not found')
          source = source.replace(old_post, new_post)
          source = source.replace('    // entities, then render normal mobs once with a lightweight red outline.\n', '    // entities, then render normal mobs once with a lightweight red halo behind\n    // damaged sprites. The halo uses only simple fills: no filter or shadow blur.\n')
          path.write_text(source, encoding='utf-8')
          main = Path('src/main.js')
          main_source = main.read_text(encoding='utf-8')
          if 'const GAME_VERSION = 120;' not in main_source: raise SystemExit('Expected GAME_VERSION 120 not found')
          main.write_text(main_source.replace('const GAME_VERSION = 120;', 'const GAME_VERSION = 121;', 1), encoding='utf-8')
          index = Path('index.html')
          index_source = index.read_text(encoding='utf-8')
          replacements = {'BUILD v120': 'BUILD v121', 'id="version-text">v120<': 'id="version-text">v121<', 'SYSTEM ONLINE • v120': 'SYSTEM ONLINE • v121'}
          for old, new in replacements.items():
              if old not in index_source: raise SystemExit(f'Expected version marker not found: {old}')
              index_source = index_source.replace(old, new, 1)
          index.write_text(index_source, encoding='utf-8')
          PY
          node --check src/features/enemyStatusVisuals.js
          node --check src/main.js
          grep -q "const DAMAGE_GLOW_COLOR = '#ff334d'" src/features/enemyStatusVisuals.js
          grep -q 'if (takingDamage) drawDamageGlow(ctx, enemy);' src/features/enemyStatusVisuals.js
          if grep -q 'drawDamageFlash' src/features/enemyStatusVisuals.js; then exit 1; fi
          grep -q 'const GAME_VERSION = 121;' src/main.js
          grep -q 'BUILD v121' index.html
          grep -q 'id="version-text">v121<' index.html
          grep -q 'SYSTEM ONLINE • v121' index.html

      - name: Commit issue 147 and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-147-hit-glow-v121.yml
          git add src/features/enemyStatusVisuals.js src/main.js index.html
          git commit -m 'Replace enemy hit circle with lightweight glow for issue #147 and bump v121'
          git push origin HEAD:main
