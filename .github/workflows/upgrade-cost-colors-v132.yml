name: One-shot v132 upgrade cost styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-cost-colors-v132.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v132 upgrade cost styling
        shell: bash
        run: python3 .github/patch-upgrade-cost-colors-v132.py

      - name: Validate v132 upgrade cost styling
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.meta-upgrade-rank--next .meta-upgrade-rank__footer' styles/meta-upgrades.css
          grep -Fq 'color: #ff667d;' styles/meta-upgrades.css
          grep -Fq 'font-size: 12px;' styles/meta-upgrades.css
          grep -Fq 'color: #70dc8b;' styles/meta-upgrades.css
          grep -Fq 'const GAME_VERSION = 132;' src/main.js
          grep -Fq 'BUILD v132' index.html
          grep -Fq 'id="version-text">v132<' index.html
          grep -Fq 'SYSTEM ONLINE • v132' index.html
          grep -Fq 'setGameVersion?.(GAME_VERSION)' src/main.js

      - name: Commit cleaned v132 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/upgrade-cost-colors-v132.yml .github/patch-upgrade-cost-colors-v132.py
          git add styles/meta-upgrades.css src/main.js index.html
          git commit -m 'Color upgrade Gold costs by affordability and bump v132'
          git push
