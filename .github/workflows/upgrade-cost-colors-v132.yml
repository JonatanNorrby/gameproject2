name: One-shot v132 upgrade cost styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-cost-colors-v132.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v132 upgrade cost styling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css = Path('styles/meta-upgrades.css')
          text = css.read_text(encoding='utf-8')
          old = '''.meta-upgrade-rank__footer {
  margin-top: auto;
  padding-top: 10px;
  color: #718096;
  font-size: 8px;
  font-weight: 900;
  line-height: 1.35;
  letter-spacing: .035em;
  text-transform: uppercase;
}

.meta-upgrade-rank--affordable .meta-upgrade-rank__footer {
  color: #f0d77c;
}
'''
          new = '''.meta-upgrade-rank__footer {
  margin-top: auto;
  padding-top: 10px;
  color: #718096;
  font-size: 8px;
  font-weight: 900;
  line-height: 1.35;
  letter-spacing: .035em;
  text-transform: uppercase;
}

.meta-upgrade-rank--next .meta-upgrade-rank__footer {
  color: #ff667d;
  font-size: 12px;
  font-weight: 1000;
  line-height: 1.25;
  text-shadow: 0 0 10px rgba(255,102,125,.2);
}

.meta-upgrade-rank--affordable .meta-upgrade-rank__footer {
  color: #70dc8b;
  text-shadow: 0 0 10px rgba(112,220,139,.22);
}
'''
          assert text.count(old) == 1, 'Expected current upgrade footer styles exactly once'
          css.write_text(text.replace(old, new), encoding='utf-8')

          main = Path('src/main.js')
          text = main.read_text(encoding='utf-8')
          assert text.count('const GAME_VERSION = 131;') == 1, 'Expected GAME_VERSION 131 exactly once'
          main.write_text(text.replace('const GAME_VERSION = 131;', 'const GAME_VERSION = 132;'), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          markers = {
              'BUILD v131': 'BUILD v132',
              'id="version-text">v131<': 'id="version-text">v132<',
              'SYSTEM ONLINE • v131': 'SYSTEM ONLINE • v132',
          }
          for old_marker, new_marker in markers.items():
              assert text.count(old_marker) == 1, f'Expected version marker exactly once: {old_marker}'
              text = text.replace(old_marker, new_marker)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Validate v132 upgrade cost styling
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.meta-upgrade-rank--next .meta-upgrade-rank__footer' styles/meta-upgrades.css
          grep -Fq 'color: #ff667d;' styles/meta-upgrades.css
          grep -Fq 'font-size: 12px;' styles/meta-upgrades.css
          grep -Fq 'color: #70dc8b;' styles/meta-upgrades.css
          grep -Fq 'const GAME_VERSION = 132;' src/main.js
          grep -Fq 'BUILD v132' index.html
          grep -Fq 'id="version-text">v132<' index.html
          grep -Fq 'SYSTEM ONLINE • v132' index.html
          grep -Fq 'setGameVersion?.(GAME_VERSION)' src/main.js

      - name: Commit cleaned v132 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/upgrade-cost-colors-v132.yml
          git add styles/meta-upgrades.css src/main.js index.html
          git commit -m 'Color upgrade Gold costs by affordability and bump v132'
          git push
